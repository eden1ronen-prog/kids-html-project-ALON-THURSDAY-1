<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>

body{
    font-family:Arial, sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
}

.restart{
    margin-top:30px;
    font-size:20px;
}

</style>

</head>
<body>

<h1>🦸 איזה כשף אווטאר? 🦸</h1>

<div id="game"></div>

<script>

/* =====================================================
   אזור 1 - הגיבורים
   הילדים יכולים לשנות שמות, תמונות וכוחות
   ===================================================== */

let heroes = {


fire:{
name:"כשף אש 🔥",
image:"https://static.wikia.nocookie.net/avatar/images/9/9d/Fire_Nation_army.png/revision/latest/scale-to-width-down/250?cb=20120722112350&path-prefix=he",
power1:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBN1t3wbo0i3LgIAD4JxLtO81KmQE5q67FBw&s",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZlmS0paMDR_hYUbMrnhnjrfwaLNVv_mAGNw&s",
description:"שולט באש, יוצר כדורי אש ומגן להבות."
},

ice:{
name:"כשף מים ❄️",
image:"https://static.wikia.nocookie.net/avatar/images/2/2d/W1.jpg/revision/latest?cb=20101006160652&path-prefix=hem.jpg",
power1:"https://static.wikia.nocookie.net/avatar/images/2/28/W5.jpg/revision/latest/scale-to-width-down/284?cb=20101006221819&path-prefix=he",
power2:"https://i.ytimg.com/vi/wx13Wm-RGwo/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDDCbmVWarckdFbw8ZxooDR0de8dQ",
description:"יכול לרפא אך יכול גם להרוג בשניות כשפים מיומנים."
},

lightning:{
name:"כשף אוויר ⚡",
image:"https://static.wikia.nocookie.net/avatar/images/3/3e/Swap.png/revision/latest?cb=20091228181313&path-prefix=he",
power1:"https://static.wikia.nocookie.net/avatar/images/8/87/Ying.jpg/revision/latest/scale-to-width-down/333?cb=20091228181831&path-prefix=he",
power2:"https://static.wikia.nocookie.net/avatar/images/e/ed/Tornadi.jpg/revision/latest?cb=20091228181410&path-prefix=he",
description:"רץ במהירות על ומזמן ברקים."
}

};


/* =====================================================
   אזור 2 - שאלות
   ===================================================== */

let questions = [

{
q:"מה מזג האוויר האהוב עליך?",
answers:[
["יום שמשי 🔥","fire"],
["יום גשום ❄️","ice"],
["סערת ברקים ⚡","lightning"]
]
},

{
q:"איזה כוח היית רוצה לקבל?",
answers:[
["ליצור אש","fire"],
["להקפיא דברים","ice"],
["לשלוט באויר","lightning"]
]
},

{
q:"איך היית נלחם בנבל?",
answers:[
["כדור אש","fire"],
["מלכודת קרח","ice"],
["מכת ברק","lightning"]
]
}

];


/* =====================================================
   משתני משחק
   ===================================================== */

let fire;
let ice;
let lightning;
let step;


/* =====================================================
   התחלת משחק
   ===================================================== */

function startGame(){

fire = 0;
ice = 0;
lightning = 0;

step = 0;

showQuestion();

}


/* =====================================================
   הצגת שאלה
   ===================================================== */

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;

}

document.getElementById("game").innerHTML = html;

}


/* =====================================================
   בחירת תשובה
   ===================================================== */

function choose(type){

if(type=="fire"){
fire++;
}

if(type=="ice"){
ice++;
}

if(type=="lightning"){
lightning++;
}

step++;

if(step < questions.length){

showQuestion();

}
else{

showResult();

}

}


/* =====================================================
   הצגת תוצאה
   ===================================================== */

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML =

`
<h2>🎉 הגיבור שאתה הוא:</h2>

<h1>${hero.name}</h1>

<img class="heroImage"
src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הכוחות שלך</h2>

<div class="powerImages">

<img src="${hero.power1}">

<img src="${hero.power2}">

</div>

<button class="restart"
onclick="startGame()">
🔄 חזרה להתחלה
</button>
`;

}


/* =====================================================
   התחלת המשחק בעת פתיחת הדף
   ===================================================== */

startGame();

</script>

</body>
</html>
