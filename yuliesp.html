<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:20px;
}
</style>

</head>
<body>

<div id="game"></div>

<script>

let heroes = {

fire:{
name:"איש הלבה 🔥",
image:"https://cdn.playtherapysupply.com/img/f/b0fda49e5406.jpg",
power1:"https://cdna.artstation.com/p/assets/images/images/024/685/180/large/rohan-adel-lava-man-rohan-adel-character-sheet-artstation.jpg?1583208067",
power2:"https://d3q27bh1u24u2o.cloudfront.net/ckeditor/2013/03/11/4.jpg",
description:"שולט בלבה ויוצר כדורי אש."
},

ice:{
name:"איש המים 💧",
image:"https://i.pinimg.com/736x/36/1f/97/361f973882429c60216c67f618212a68.jpg",
power1:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSL8cLgKW_b98Vu6pq8WmV64Bmw0GuKnP9O3w&s",
power2:"https://www.shutterstock.com/image-illustration/human-figure-ascend-upward-water-260nw-10398079.jpg",
description:"מקפיא אויבים ובונה חומות קרח."
},

lightning:{
name:"איש הזמן ⏰",
image:"https://thumbs.dreamstime.com/b/business-man-juggling-his-time-alarm-clocks-young-skillful-successfully-managing-116463563.jpg",
power1:"https://cdn.mos.cms.futurecdn.net/v2/t:0,l:240,cw:1440,ch:1080,q:80,w:1440/VgGxJABA8DcfAMpPPwdv6a.jpg",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSygqT9JYffhKow9kGO5VO1uZ-2dkHfOSOs3A&s",
description:"נוסע בזמן ושולט בברקים."
}

};

let questions = [

{
q:"מה מזג האוויר האהוב עליך?",
answers:[
["יום חם 🔥","fire"],
["יום מושלג ❄️","ice"],
["סערת ברקים ⚡","lightning"]
]
},

{
q:"איזה כוח היית רוצה לקבל?",
answers:[
["ליצור אש","fire"],
["להקפיא דברים","ice"],
["לשלוט בחשמל","lightning"]
]
},

{
q:"איך היית נלחם בנבל?",
answers:[
["כדור אש","fire"],
["מלכודת קרח","ice"],
["מכת ברק","lightning"]
]
}

];

let fire;
let ice;
let lightning;
let step;

function startGame(){

fire = 0;
ice = 0;
lightning = 0;
step = 0;

showQuestion();
}

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;
}

document.getElementById("game").innerHTML = html;
}

function choose(type){

if(type==="fire") fire++;
if(type==="ice") ice++;
if(type==="lightning") lightning++;

step++;

if(step < questions.length){
showQuestion();
}else{
showResult();
}
}

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML = `
<h2>🎉 הגיבור שאתה הוא:</h2>

<h1>${hero.name}</h1>

<img class="heroImage" src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הכוחות שלך</h2>

<div class="powerImages">
<img src="${hero.power1}">
<img src="${hero.power2}">
</div>

<br>

<button onclick="startGame()">
🔄 חזרה להתחלה
</button>
`;
}

startGame();

</script>

</body>
</html>
